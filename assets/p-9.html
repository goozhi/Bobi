<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/scripts/exym.qwse.js"></script>
  <script src="/qwse_1/p-9/play.js"></script>
  <script src="/qwse_1/p-9/drawGrid.js"></script>
  <title>九宫格解锁 - 图案收藏夹</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    p {
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 100%;
    }

    canvas {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      display: block;
      margin: 0 auto;
    }

    .input-area {
      margin: 20px 0;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      resize: none;
    }

    input[type="text"] {
      padding: 10px 15px;
      width: 180px;
      border: none;
      border-radius: 8px;
      margin: 0 5px;
    }

    button {
      padding: 10px 15px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      margin: 0 5px;
    }

    button:hover {
      background: #ee5253;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
      transform: none;
    }

    .info {
      margin-top: 15px;
      font-size: 0.9em;
      opacity: 0.8;
      text-align: center;
    }

    /* 图案列表 */
    .pattern-list {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 15px;
      max-height: 200px;
      overflow-y: auto;
    }

    .pattern-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      margin: 5px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .pattern-item:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .pattern-name {
      font-weight: 500;
    }

    .pattern-code {
      font-size: 0.85em;
      opacity: 0.8;
    }

    .delete-btn {
      color: #ff6b6b;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }
  </style>
</head>

<body>
  <h1>📱 九宫格解锁动画</h1>
  <div>
    <button onclick="outputDataLength()">输出数据个数</button>
    <button onclick="outputData()">输出数据</button>
    <button onclick="inputData()">覆盖数据</button>
    <button onclick="inputDataUseVdum_zul()">用输出框覆盖数据</button>
  </div>

  <div class="container">
    <canvas id="gridCanvas" width="300" height="300"></canvas>

    <div class="input-area">
      <input type="text" id="pointInput" placeholder="输入点位，如：1,5,9" value="1,5,9" />
      <button onclick="playAnimation2()">▶ 播放</button>
      <button onclick="getClip()">▶ 粘贴</button>
    </div>

    <div class="input-area">
      <input type="text" id="patternName" placeholder="给图案起个名字吧~" value="我的第一个图案" />
      <button onclick="savePattern()">💾 保存</button>
    </div>
    <div class="input-area">
      <input type="text" id="pointInput2" placeholder="输入点位，如：1,5,9" value="" />
      <input type="text" id="patternName2" placeholder="name" value="" />
      <button onclick="searchPattern()">搜索</button>
      <button onclick="hdPattern()">删除</button>
    </div>
    <div>
      <textarea name="vdzv_zul" id="vdzv_zul" placeholder="(savedPatterns)=>{}"></textarea>
      <button id="vdum_zstv" onclick="zhqh_tsjq()">vdum</button>
      <button id="vdum_afoa_zstv" onclick="zhqh_afoa_tsjq()">vdum afoa</button>
      <button id="qqld_zstv" onclick="qqld_zstv()">ld</button>
      <button id="qqld_zstv" onclick="clear_vdzv_zul()">clear</button>
      <textarea name="vdum_zul" id="vdum_zul"></textarea>
    </div>

    <!-- <div class="info">
      点位对应：<br>
      1 2 3<br>
      4 5 6<br>
      7 8 9
    </div> -->

    <div class="pattern-list" id="patternList">
      <!-- 图案会动态插入到这里 -->
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const size = 300;
    const cell = size / 3;
    const points = [];

    // 初始化9个点的位置
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        points.push({
          x: col * cell + cell / 2,
          y: row * cell + cell / 2
        });
      }
    }

    // 存储的图案（从 localStorage 读取）
    let savedPatterns = JSON.parse(localStorage.getItem('unlockPatterns') || '[]');

    // 绘制静态网格
    let yo_draw = new drawGrid({ ctx, points, cell, size })
    // 播放动画

    function outputDataLength() {
      prompt('data length and last:', savedPatterns.length + JSON.stringify(savedPatterns[savedPatterns.length - 1]));
    }
    const vdzv_zul = document.getElementById('vdzv_zul')
    const vdum_zul = document.getElementById('vdum_zul')

    function clear_vdzv_zul() {
      vdzv_zul.value = ""
    }
    function qqld_zstv() {
      const rj1 = vdzv_zul.value
      vdzv_zul.value = vdum_zul.value
      vdum_zul.value = rj1
    }
    function zhqh_afoa_tsjq() {
      fetch('/afoa', {
        method: "POST",
        headers: {
          'Content-Type': 'application/json',
          'Access-Control-Request-Headers': '*'
        },
        body: JSON.stringify({ vdzv: vdzv_zul.value })
      }).then(res => {
        if (res.ok) {
          return res.json()
        } else {
          throw res
        }
      }).then(jtyj_1 => {
        vdum_zul.value = String(jtyj_1.outputText)
      })
    }
    function zhqh_tsjq() {
      const funcStr = document.getElementById('vdzv_zul').value.trim();
      if (!funcStr) {
        alert('请输入一个函数哦~');
        return;
      }
      let func
      try {
        func = eval(funcStr)
      } catch (e) {
        alert("函数格式错误")
        return
      }
      if (typeof func !== 'function') {
        alert("请输入一个函数哦~");
        return;
      }
      try {
        const result = func(savedPatterns)
        document.getElementById('vdum_zul').value = JSON.stringify(result, null, 2)
      } catch (e) {
        alert("函数执行出错：" + e.message)
      }
    }
    function outputData() {
      copyToClipboard(JSON.stringify(savedPatterns, null, 2))
      document.getElementById('vdum_zul').value = JSON.stringify(savedPatterns, null, 2)
      alert('cd copy')
    }
    function inputDataUseVdum_zul() {
      const input = document.getElementById('vdum_zul').value.trim();
      if (!input) {
        alert('输出框是空的哦~');
        return;
      }
      const wm1 = (() => {
        try {
          return JSON.parse(input)
        } catch (e) {
          alert("格式出错")
          return null
        }
      })()
      if (wm1) {
        savedPatterns.splice(0, savedPatterns.length, ...wm1)
        localStorage.setItem('unlockPatterns', JSON.stringify(savedPatterns));
        refreshPatternList();
      } else {
        alert("数据不正确")
      }
    }
    function inputData() {
      const input = prompt('Paste exported drawing data URL here:');
      if (!input) return;
      const wm1 = (() => {
        try {
          return JSON.parse(input)
        } catch (e) {
          alert("格式出错")
          return null
        }
      })()
      if (wm1) {
        savedPatterns.splice(0, savedPatterns.length, ...wm1)
        localStorage.setItem('unlockPatterns', JSON.stringify(savedPatterns));
      } else {
        alert("数据不正确")
      }
    }
    const pointInput = document.getElementById('pointInput')

    function yj_nixb(neig_kp = {}) {
      const nameInput = document.getElementById('patternName2').value.trim();
      const pointInput = document.getElementById('pointInput2').value.trim();
      const name = nameInput || ''
      let eqwy_yhld
      const nixb = savedPatterns.find((rn1, eqwy_1) => {
        if (name && rn1.name === name) {
          eqwy_yhld = eqwy_1
          return true
        }
        if (pointInput && rn1.code === pointInput) {
          eqwy_yhld = eqwy_1
          return true
        }
      })
      if (neig_kp.atvn_eowl) {
        return neig_kp.atvn_eowl(nixb, eqwy_yhld)
      } else {
        return nixb
      }
    }
    function syig_vdzv(nixb) {
      const nameInput = document.getElementById('patternName2')
      const pointInput = document.getElementById('pointInput2')
      nameInput.value = nixb.name
      pointInput.value = nixb.code
    }
    const yo_play = new playAnimation({
      ctx, points, cell: cell * 0.8, trl_jyqh: () => {
        ctx.clearRect(0, 0, size, size);
        yo_draw.draw()
      }
    })
    function playAnimation2() {
      yo_play.play()
    }
    function searchPattern() {
      const nixb = yj_nixb()
      if (nixb) {
        syig_vdzv(nixb)
        yo_play.play(nixb.code)
      } else {
        alert("ra yjab-" + name)
      }
    }
    function hdPattern() {
      const nixb = yj_nixb({ atvn_eowl: (rn1, eqwy_1) => [rn1, eqwy_1] })
      if (!nixb || !nixb[0]) {
        alert("ra yjab-" + name)
      } else {
        savedPatterns.splice(nixb[1], 1)
        refreshPatternList()
        localStorage.setItem('unlockPatterns', JSON.stringify(savedPatterns));
        alert('cd hd-' + nixb[0].name + nixb[0].code)
      }
    }
    // 保存图案
    function savePattern() {
      const input = document.getElementById('pointInput').value;
      const nameInput = document.getElementById('patternName').value.trim();
      const name = nameInput || `图案${savedPatterns.length + 1}`;
      const code = (() => {
        const val = input.replace(/,$/, '').replace(/\s/g, '').trim();
        if (/,/.test(val)) {
          return val
        } else {
          return val.split('').join(',')
        }
      })();

      if (!code) {
        alert('请输入点位序列哦~');
        return;
      }

      if (!/^\d+(,\d+)*$/.test(code)) {
        alert('请输入合法的数字序列，如：1,2,3');
        return;
      }

      // 防止重复保存
      const exists = savedPatterns.some(p => p.code === code);
      if (exists) {
        alert('这个图案已经保存过啦！');
        return;
      } else if (savedPatterns.some(p => {
        if (code.split(',')[0] === code.split(',').reverse()[0]) {
          const wm1 = code.split(',')
          const wm1_qq = wm1.slice().reverse()
          const wm2 = wm1.map((rn1, eqwy_1, wm1) => [rn1, wm1[eqwy_1 + 1]])
          const wm2_qq = wm1_qq.map((rn1, eqwy_1, wm1_qq) => [rn1, wm1_qq[eqwy_1 + 1]])
          wm2.splice(-1, 1)
          wm2_qq.splice(-1, 1)
          if (p.code[0] === p.code[p.code.length - 1]) {
            const wm3 = p.code.split(',').map((rn1, eqwy_1, wm) => [rn1, wm[eqwy_1 + 1]])
            wm3.splice(-1, 1)
            if (wm2.length === wm3.length) {
              if (wm3.every(rn3 => wm2.some(rn4 => rn3[0] === rn4[0] && rn3[1] === rn4[1]))) {
                return true
              } else if (wm3.every(rn3 => wm2_qq.some(rn4 => rn3[0] === rn4[0] && rn3[1] === rn4[1]))) {
                return true

              }
            }
          }
        }
      })) {
        alert('这个回旋图案已经保存过啦！');
        return;
      } else if (savedPatterns.some(p => p.code === code.split(',').reverse().join(','))) {
        alert('这个图案的反序已经保存过啦！');
        return;
      } else {
        const name_exists = savedPatterns.some(p => p.name === name);
        if (name_exists) {
          alert('这个名字已经有啦！');
          return;
        }


      }

      savedPatterns.push({ name, code });
      localStorage.setItem('unlockPatterns', JSON.stringify(savedPatterns));
      refreshPatternList();
      alert(`✅ "${name}" 已保存到你的解锁收藏夹！`);
    }

    // 删除图案
    function deletePattern(index) {
      if (confirm('确定要删除这个图案吗？')) {
        savedPatterns.splice(index, 1);
        localStorage.setItem('unlockPatterns', JSON.stringify(savedPatterns));
        refreshPatternList();
      }
    }

    // 刷新图案列表
    function refreshPatternList() {
      const listEl = document.getElementById('patternList');
      listEl.innerHTML = '';

      if (savedPatterns.length === 0) {
        listEl.innerHTML = '<div class="info">还没有保存任何图案哦~试试输入一个并保存吧！</div>';
        return;
      }

      savedPatterns.forEach((pattern, index) => {
        const item = document.createElement('div');
        item.className = 'pattern-item';
        item.innerHTML = `
          <div>
            <div class="pattern-name">${pattern.name}</div>
            <div class="pattern-code">${pattern.code}</div>
          </div>
          <button class="delete-btn" onclick="deletePattern(${index})">×</button>
        `;
        item.onclick = (e) => {
          if (!e.target.classList.contains('delete-btn')) {
            document.getElementById('pointInput').value = pattern.code;
            yo_play.play(pattern.code);
          }
        };
        listEl.appendChild(item);
      });
    }
    function getClip() {
      getClipboardText().then(res => {
        pointInput.value = res
      }).catch(e => alert(e.message))
    }

    // 点击画布添加点（彩蛋）
    canvas.addEventListener('click', () => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      let closestIndex = -1;
      let minDist = Infinity;

      points.forEach((p, i) => {
        const dist = (p.x - x) ** 2 + (p.y - y) ** 2;
        if (dist < minDist && dist < (cell * 0.4) ** 2) {
          minDist = dist;
          closestIndex = i;
        }
      });

      if (closestIndex !== -1) {
        const input = document.getElementById('pointInput');
        const current = input.value.replace(/,$/, '');
        input.value = current ? `${current},${closestIndex + 1}` : `${closestIndex + 1}`;
      }
    });

    // 初始化
    yo_draw.draw();
    refreshPatternList(); // 加载已保存的图案
  </script>
</body>

</html>
