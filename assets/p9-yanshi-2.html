<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>混合输入 - 连线 / 烟花 / 高亮触发按键</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120, #111827);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 64px;
            padding: 20px 16px 32px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 20px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 48px;
            pointer-events: none;
        }

        .grid {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* 默认按键样式 */
        .key {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #0f172a;
            box-shadow: 0 12px 18px rgba(0, 0, 0, 0.4);
            transition: 0.1s ease;
            cursor: pointer;
            touch-action: none;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        /* 💡 已触发按键高亮（永久保持） */
        .key.highlight {
            background: radial-gradient(circle at 30% 30%, #facc15, #f59e0b);
            color: #1e1b2f;
            box-shadow: 0 0 12px #ffd966;
            transform: scale(0.96);
        }

        /* 瞬时按下反馈 */
        .key.active {
            transform: scale(0.92);
            filter: brightness(1.1);
        }

        .trajectory-panel {
            background: #0f172a;
            border-radius: 42px;
            padding: 16px 20px;
            margin-top: 4px;
        }

        .label {
            font-size: 13px;
            color: #94a3b8;
        }

        .trajectory {
            font-size: 18px;
            font-weight: bold;
            color: #facc15;
            background: #020617;
            padding: 12px 16px;
            border-radius: 32px;
            margin: 8px 0 12px;
            font-family: monospace;
        }

        .last-trajectory {
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }

        .info {
            text-align: center;
            color: #9ca3af;
            margin-top: 16px;
            font-size: 12px;
        }

        button {
            background: #facc15;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .key {
                font-size: 24px;
            }

            .grid {
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="info">
            <span id="sj1" style="color:#facc15;"> 保持高亮 ✨</span>
        </div>
        <div class="canvas-container" id="canvasContainer">
            <canvas id="lineCanvas" width="500" height="500"></canvas>
            <div class="grid" id="gestureGrid"></div>
        </div>
        <div class="trajectory-panel">
            <div class="label">✨ 当前轨迹（点击+滑动）</div>
            <div class="trajectory" id="trajectoryDisplay">⚡ 触摸或点击</div>
            <div class="last-trajectory" id="lastTrajectoryDisplay">⏮ 上次轨迹: —</div>
        </div>
        <button id="resetBtn">⟳ 重置轨迹 & 清空高亮</button>
        <button id="refresh_ztwy_cqzt">⟳字典刷新</button>
        <button id="syig_zhkl_caum">⟳提示刷新</button>
        <textarea name="vdzv_zul_1" id="vdzv_zul_1"></textarea>
    </div>

    <script>
        (function () {
            var wm_ztwy_cqzt = []
            let wrm_ztwy_cqzt = {}
            nwvt_bj_uace_ztwy()
            const map_zdog_ybkc = new Map()
            const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
            let currentSequence = [];
            let lastSequence = [];
            let triggeredSet = new Set();   // 已触发过的按键（用于高亮维持）
            let resetTimer = null;
            let isMoving = false;

            let vn_tymi_zhkl = 0
            var wm_sj1 = [
                { code: "158", name: "我" },
                { code: "148", name: "你" },
                { code: "139", name: "他" }
            ]
            let eqwy_zhkl = 0

            const sj1 = document.getElementById('sj1');
            set_zhkl()
            const vdzv_zul_1 = document.getElementById('vdzv_zul_1');
            const gridEl = document.getElementById('gestureGrid');
            const trajDiv = document.getElementById('trajectoryDisplay');
            const lastTrajDiv = document.getElementById('lastTrajectoryDisplay');
            const lineCanvas = document.getElementById('lineCanvas');
            const ctx = lineCanvas.getContext('2d');
            const container = document.getElementById('canvasContainer');

            let keyRects = new Map();     // key -> { cx, cy, left, top, w, h }
            let keyElements = new Map();

            // ---------- 烟花粒子 ----------
            let particles = [];
            let animFrame = null;

            function findCodeUseName(name) {
                return wrm_ztwy_cqzt[name]?.code || "13971"

            }
            function findUseCode(code) {
                const map_yhld = new Map()
                wm_ztwy_cqzt.forEach(rn1 => {
                    map_yhld.set(rn1.code.replace(/,/g, ""), rn1)
                })
                return map_yhld.get(code)
            }
            function syig_zhkl_caum() {

                wm_sj1 = vdzv_zul_1.value.split("").map(rn1 => {
                    return { name: rn1, code: findCodeUseName(rn1) }
                })
            }
            function nwvt_bj_uace_ztwy() {
                fetch("/zzzz/kplu/p9/cqzt-p9.json")
                    .then(response => {
                        // 检查请求是否成功
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        // 将响应解析为 JSON
                        return response.json();
                    })
                    .then(data => {
                        wm_ztwy_cqzt = data
                        wm_ztwy_cqzt.forEach(rn1 => wrm_ztwy_cqzt[rn1.name] = rn1)
                        // 在这里处理解析后的数据
                        // console.log(data);
                        // 显示数据到页面
                        // const resultDiv = document.getElementById('result');
                        // resultDiv.innerHTML = JSON.stringify(data[0], null, 2);
                    })
                    .catch(error => {
                        console.error('Fetch 错误:', error);
                    });
            }
            function random(min, max) { return min + Math.random() * (max - min); }
            class Particle {
                constructor(x, y, color) {
                    this.x = x; this.y = y;
                    this.vx = random(-3.5, 3.5);
                    this.vy = random(-6, -1.5);
                    this.gravity = 0.2;
                    this.life = 1;
                    this.color = color;
                    this.size = random(3, 6);
                }
                update() {
                    this.vx *= 0.98;
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= 0.02;
                    return this.life > 0;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.life;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            function burstFirework(x, y) {
                const colors = ['#facc15', '#ff6b6b', '#4ade80', '#60a5fa', '#f472b6', '#c084fc'];
                for (let i = 0; i < 28; i++) {
                    let col = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(x, y, col));
                }
                if (!animFrame) animateFireworks();
            }

            function animateFireworks() {
                if (particles.length === 0) {
                    if (animFrame) cancelAnimationFrame(animFrame);
                    animFrame = null;
                    drawLine(); // 重绘连线（避免残留）
                    return;
                }
                drawLine();  // 重绘背景连线
                for (let i = particles.length - 1; i >= 0; i--) {
                    if (!particles[i].update()) particles.splice(i, 1);
                    else particles[i].draw(ctx);
                }
                animFrame = requestAnimationFrame(animateFireworks);
            }

            // ---------- 高亮按键（永久保持）----------
            function highlightKeyPermanent(key) {
                let el = keyElements.get(key);
                if (el && !el.classList.contains('highlight')) {
                    el.classList.add('highlight');
                }
            }

            // 重置所有高亮
            function resetHighlights() {
                for (let [key, el] of keyElements.entries()) {
                    el.classList.remove('highlight');
                }
            }

            // ---------- 连线相关 ----------
            function updateKeyPositions() {
                let containerRect = container.getBoundingClientRect();
                let newRects = new Map();
                for (let [key, el] of keyElements.entries()) {
                    let r = el.getBoundingClientRect();
                    let cx = r.left + r.width / 2 - containerRect.left;
                    let cy = r.top + r.height / 2 - containerRect.top;
                    newRects.set(key, {
                        cx, cy,
                        left: r.left, top: r.top,
                        w: r.width, h: r.height
                    });
                }
                keyRects = newRects;
                resizeCanvas();
                drawLine();
            }

            function resizeCanvas() {
                let rect = container.getBoundingClientRect();
                lineCanvas.width = rect.width;
                lineCanvas.height = rect.height;
            }

            function drawLine() {
                if (!ctx) return;
                ctx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
                if (currentSequence.length < 2) return;
                ctx.beginPath();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#facc15';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#fdba74';
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                for (let i = 0; i < currentSequence.length - 1; i++) {
                    let p1 = keyRects.get(currentSequence[i]);
                    let p2 = keyRects.get(currentSequence[i + 1]);
                    if (p1 && p2) {
                        ctx.beginPath();
                        ctx.moveTo(p1.cx, p1.cy);
                        ctx.lineTo(p2.cx, p2.cy);
                        ctx.stroke();
                    }
                }
                // 画节点小圆点
                for (let i = 0; i < currentSequence.length; i++) {
                    let pt = keyRects.get(currentSequence[i]);
                    if (pt) {
                        ctx.beginPath();
                        ctx.fillStyle = '#facc15';
                        ctx.arc(pt.cx, pt.cy, 9, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#111827';
                        ctx.arc(pt.cx, pt.cy, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ---------- 轨迹核心 ----------
            function updateTrajectoryUI() {
                if (currentSequence.length === 0) trajDiv.innerText = '⚡ 触摸或点击按键';
                else trajDiv.innerText = currentSequence.join(' → ');
            }

            function set_zhkl() {
                eqwy_zhkl = vn_tymi_zhkl % wm_sj1.length
                sj1.innerText = wm_sj1[eqwy_zhkl].name //+ " " + wm_sj1[eqwy_zhkl].code
            }
            function scheduleReset() {
                if (resetTimer) clearTimeout(resetTimer);
                resetTimer = setTimeout(() => {
                    if (currentSequence.length) {
                        lastSequence = [...currentSequence];
                        // alert(wm_sj1[eqwy_zhkl].name)
                        if (currentSequence.join("") === wm_sj1[eqwy_zhkl].code.replace(/,/g, "")) {
                            vn_tymi_zhkl++
                            set_zhkl()
                        }
                        lastTrajDiv.innerText = '⏮ 上次轨迹: ' + (lastSequence.length ? lastSequence.join(' → ') : '—');
                    }
                    // ⭐ 重置时不清除高亮？根据“点亮已点过的按键”，重置需要清除高亮才合理（与UI重置保持一致）
                    resetHighlights();
                    currentSequence = [];
                    triggeredSet.clear();
                    updateTrajectoryUI();
                    drawLine();
                    resetTimer = null;
                }, 700);
            }
            function triggerKey(key, fromClick = false) {
                if (!key) return;
                if (!fromClick && triggeredSet.has(key) && Date.now() - (map_zdog_ybkc.get(key) || Date.now()) < 300) return;
                triggeredSet.add(key);
                map_zdog_ybkc.set(key, Date.now())
                currentSequence.push(key);
                updateTrajectoryUI();
                drawLine();

                // 💡 高亮（永久）
                highlightKeyPermanent(key);

                //  🎆 烟花
                let pos = keyRects.get(key);
                if (pos) burstFirework(pos.cx, pos.cy);

                scheduleReset();

                // 瞬时反馈
                let el = keyElements.get(key);
                if (el) {
                    el.classList.add('active');
                    setTimeout(() => el.classList.remove('active'), 120);
                }
            }

            // 重置全部（按钮）
            function resetAll() {
                if (resetTimer) clearTimeout(resetTimer);
                currentSequence = [];
                triggeredSet.clear();
                lastSequence = [];
                resetHighlights();
                updateTrajectoryUI();
                lastTrajDiv.innerText = '⏮ 上次轨迹: —';
                drawLine();
            }

            // ---------- 触摸/点击查找 ----------
            function findKeyByTouch(clientX, clientY) {
                for (let [key, info] of keyRects.entries()) {
                    if (clientX >= info.left && clientX <= info.left + info.w &&
                        clientY >= info.top && clientY <= info.top + info.h) {
                        return key;
                    }
                }
                return null;
            }

            function onTouchStart(e) {
                e.preventDefault();
                isMoving = true;
                updateKeyPositions();
                let touch = e.touches[0];
                let key = findKeyByTouch(touch.clientX, touch.clientY);
                if (key) triggerKey(key, false);
            }
            function onTouchMove(e) {
                if (!isMoving) return;
                e.preventDefault();
                let touch = e.touches[0];
                let key = findKeyByTouch(touch.clientX, touch.clientY);
                if (key) triggerKey(key, false);
            }
            function onTouchEnd(e) {
                e.preventDefault();
                isMoving = false;
                scheduleReset();
            }

            function onKeyClick(key) {
                triggerKey(key, true);
            }

            // 构建UI
            function buildGrid() {
                gridEl.innerHTML = '';
                keyElements.clear();
                KEYS.forEach(k => {
                    let div = document.createElement('div');
                    div.className = 'key';
                    div.innerText = k;
                    div.addEventListener('on_click', (e) => {
                        alert(932)
                        e.stopPropagation();
                        onKeyClick(k);
                    });
                    gridEl.appendChild(div);
                    keyElements.set(k, div);
                });
                setTimeout(() => {
                    updateKeyPositions();
                    window.addEventListener('resize', () => updateKeyPositions());
                }, 50);
            }

            function bindEvents() {
                gridEl.addEventListener('touchstart', onTouchStart, { passive: false });
                gridEl.addEventListener('touchmove', onTouchMove, { passive: false });
                gridEl.addEventListener('touchend', onTouchEnd);
                document.body.addEventListener('touchmove', (e) => {
                    if (isMoving) e.preventDefault();
                }, { passive: false });
            }

            buildGrid();
            bindEvents();
            document.getElementById('resetBtn').addEventListener('click', resetAll);
            document.getElementById('refresh_ztwy_cqzt').addEventListener('click', nwvt_bj_uace_ztwy);
            document.getElementById('syig_zhkl_caum').addEventListener('click', () => {
                console.log("click zhkl uace")
                syig_zhkl_caum()
                set_zhkl()
            });

            updateTrajectoryUI();
        })();
    </script>
</body>

</html>
