<div class="app-container">
    <div class="global-toolbar">
        <div style="display: flex; gap: 6px;">
            <button class="tool-btn" id="addLineBtn">➕ 新增行</button>
            <button class="tool-btn" id="clearEditorBtn">🗑️ 清空</button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="status-badge" id="modeStatus">⌨️ 光标模式</span>
            <button id="toggleBlockKeyboardBtn" class="toggle-switch active">🔒 禁用系统键盘</button>
        </div>
    </div>

    <div class="editor-wrapper">
        <textarea id="codeEditor">
📱 悬浮键盘 + 动态禁用系统键盘开关

✨ 新功能：
• 点击右上角【禁用系统键盘】按钮可随时切换模式
• 绿色锁定状态 → 手机原生键盘【不会弹出】
• 红色解锁状态 → 手机原生键盘【可以弹出】（便于调试或特殊场景）

🤖 讯飞风格选择面板：
• 点击【选择】键后，按左右键扩展选区
• 支持复制/剪切/删除/撤销
• 可拖拽悬浮键盘到任意位置

试试关闭禁用模式，然后点击编辑区看看原生键盘是否弹出
        </textarea>
    </div>
    <div class="info-tip">
