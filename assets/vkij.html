<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>讯飞风格选择面板 | CodeMirror + 自定义键盘 | 完整禁用系统键盘</title>
    <!-- CodeMirror v5 核心库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/theme/material.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #eef2f9;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
        }

        .global-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #f8fafd;
            border-bottom: 1px solid #eef2f8;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tool-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .tool-btn:active { transform: scale(0.96); background: #f1f5f9; }

        .status-badge {
            background: #1e293b;
            color: white;
            font-size: 0.7rem;
            padding: 5px 12px;
            border-radius: 30px;
        }

        .editor-wrapper {
            padding: 12px;
            background: #fefcf7;
        }

        .CodeMirror {
            height: auto;
            min-height: 280px;
            border-radius: 28px;
            font-size: 16px;
            background: white;
            border: 1px solid #edf2f7;
        }

        /* ========= 仿讯飞键盘面板 ========= */
        .xunfei-keyboard {
            background: #1e293b;
            background: linear-gradient(145deg, #1f2a3e, #121926);
            border-top: 1px solid #334155;
            padding: 12px 12px 20px;
        }

        /* 移动控制行 - 左右键 + 中间选择键（讯飞风格）*/
        .selection-control-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .arrow-key {
            background: #2d3e5f;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 24px;
            border-radius: 60px;
            min-width: 90px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .arrow-key:active { transform: scale(0.96); background: #3b5a7a; }

        /* 中间选择键 - 核心特色 */
        .select-key {
            background: #8b5cf6;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 60px;
            min-width: 100px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(139,92,246,0.4);
            transition: all 0.1s;
        }
        .select-key:active { transform: scale(0.96); background: #7c3aed; }
        .select-key.active {
            background: #ef4444;
            box-shadow: 0 2px 8px rgba(239,68,68,0.4);
        }

        /* 快速定位行 */
        .quick-locate-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .locate-key {
            background: #334155;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            flex: 1;
            cursor: pointer;
        }
        .locate-key:active { transform: scale(0.96); background: #475569; }

        /* 文本操作行 */
        .edit-actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }
        .edit-key {
            background: #475569;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            border: none;
            flex: 1;
            min-width: 60px;
            cursor: pointer;
        }
        .edit-key:active { transform: scale(0.96); background: #5f6c84; }
        .primary-edit { background: #8b5cf6; }
        .danger-edit { background: #dc2626; }

        /* 字母键盘区 */
        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .letter-key {
            background: #2c3e55;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            padding: 10px 0;
            border-radius: 40px;
            width: 44px;
            text-align: center;
            cursor: pointer;
        }
        .letter-key:active { transform: scale(0.93); background: #3e5a7c; }
        .space-key { width: 130px; background: #2d3e5f; }
        .wide-key { width: auto; padding: 10px 16px; }

        .info-tip {
            font-size: 0.65rem;
            text-align: center;
            padding: 8px;
            background: #f1f6fe;
            color: #4b5565;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="global-toolbar">
        <div>
            <button class="tool-btn" id="addLineBtn">➕ 新增行</button>
            <button class="tool-btn" id="clearEditorBtn">🗑️ 清空</button>
        </div>
        <div class="status-badge" id="modeStatus">⌨️ 光标模式</div>
    </div>

    <div class="editor-wrapper">
        <textarea id="codeEditor">
📱 讯飞风格选择面板演示 (已修复 inputStyle)

点击下方键盘的【选择】按钮，进入选择模式
然后按 ◀ 左移 / 右移 ▶ 来扩展选区边界

选中文字后，可以使用复制/剪切/删除功能

左右移动键：普通模式移动光标，选择模式扩展选区
        </textarea>
    </div>

    <div class="xunfei-keyboard" id="customKeyboardPanel">
        <!-- 核心：选择控制行 - 左移 | 选择键 | 右移 -->
        <div class="selection-control-row">
            <button class="arrow-key" id="moveLeftBtn">◀ 左移</button>
            <button class="select-key" id="selectModeBtn">🔽 选择</button>
            <button class="arrow-key" id="moveRightBtn">右移 ▶</button>
        </div>

        <!-- 快速定位辅助行 -->
        <div class="quick-locate-row">
            <button class="locate-key" id="moveStartBtn">⤒ 行首</button>
            <button class="locate-key" id="moveEndBtn">⤓ 行尾</button>
            <button class="locate-key" id="selectAllBtn">✅ 全选</button>
        </div>

        <!-- 文本操作行 -->
        <div class="edit-actions-row">
            <button class="edit-key" id="copyBtn">📋 复制</button>
            <button class="edit-key" id="cutBtn">✂️ 剪切</button>
            <button class="edit-key danger-edit" id="deleteBtn">🗑️ 删除</button>
            <button class="edit-key" id="undoBtn">↩️ 撤销</button>
        </div>

        <!-- 字母键盘行 -->
        <div class="key-row">
            <button class="letter-key" data-char="q">Q</button><button class="letter-key" data-char="w">W</button>
            <button class="letter-key" data-char="e">E</button><button class="letter-key" data-char="r">R</button>
            <button class="letter-key" data-char="t">T</button><button class="letter-key" data-char="y">Y</button>
            <button class="letter-key" data-char="u">U</button><button class="letter-key" data-char="i">I</button>
            <button class="letter-key" data-char="o">O</button><button class="letter-key" data-char="p">P</button>
        </div>
        <div class="key-row">
            <button class="letter-key" data-char="a">A</button><button class="letter-key" data-char="s">S</button>
            <button class="letter-key" data-char="d">D</button><button class="letter-key" data-char="f">F</button>
            <button class="letter-key" data-char="g">G</button><button class="letter-key" data-char="h">H</button>
            <button class="letter-key" data-char="j">J</button><button class="letter-key" data-char="k">K</button>
            <button class="letter-key" data-char="l">L</button>
        </div>
        <div class="key-row">
            <button class="letter-key" data-char="z">Z</button><button class="letter-key" data-char="x">X</button>
            <button class="letter-key" data-char="c">C</button><button class="letter-key" data-char="v">V</button>
            <button class="letter-key" data-char="b">B</button><button class="letter-key" data-char="n">N</button>
            <button class="letter-key" data-char="m">M</button>
            <button class="letter-key wide-key" data-char=",">,</button>
            <button class="letter-key wide-key" data-char=".">.</button>
        </div>
        <div class="key-row">
            <button class="letter-key space-key" data-char=" ">空格</button>
            <button class="letter-key wide-key" id="deleteCharBtn">⌫ 删除</button>
            <button class="letter-key wide-key" id="newlineBtn">↵ 换行</button>
        </div>
    </div>
    <div class="info-tip">
        💡 【选择模式】提示：点击「选择」后，再按左右键即可扩展选区 | 再次点击「选择」退出选择模式
        <br>✅ 已设置 inputStyle="textarea" + inputMode="none"，系统键盘已被完全禁用
    </div>
</div>

<script>
    // ========== 初始化 CodeMirror 编辑器 ==========
    // ★★★★★ 关键配置: inputStyle: "textarea" 确保使用 textarea 底层，这样才能设置 inputMode="none" ★★★★★
    const textarea = document.getElementById('codeEditor');
    const editor = CodeMirror.fromTextArea(textarea, {
        lineNumbers: true,
        theme: "material",
        lineWrapping: true,
        inputStyle: "textarea",   // ★★★★★ 这是最关键的一行！★★★★★
        extraKeys: {
            "Insert": () => false, "Enter": () => false, "Space": () => false,
            "Tab": () => false, "Backspace": () => false, "Delete": () => false,
            "Cmd": () => false, "Ctrl": () => false, "Alt": () => false
        }
    });

    // ★★★★★ 禁用系统键盘的核心: 找到底层 textarea 并设置 inputmode="none" ★★★★★
    const cmWrapper = editor.getWrapperElement();
    const hiddenTextarea = cmWrapper.querySelector('textarea');
    if (hiddenTextarea) {
        hiddenTextarea.setAttribute('inputmode', 'none');
        hiddenTextarea.setAttribute('readonly', 'readonly');
        hiddenTextarea.style.pointerEvents = 'none';
        // 强制设置 inputMode 属性
        hiddenTextarea.inputMode = 'none';
    }

    // 额外保障：每次编辑器获得焦点时重新设置
    editor.on('focus', () => {
        const ta = cmWrapper.querySelector('textarea');
        if (ta) {
            ta.setAttribute('inputmode', 'none');
            ta.inputMode = 'none';
            ta.setAttribute('readonly', 'readonly');
        }
    });

    // ========== 选择模式状态管理（仿讯飞核心功能）==========
    let selectMode = false;

    const selectModeBtn = document.getElementById('selectModeBtn');
    const modeStatusSpan = document.getElementById('modeStatus');

    function updateModeUI() {
        if (selectMode) {
            selectModeBtn.classList.add('active');
            selectModeBtn.innerHTML = '🔴 选择中';
            modeStatusSpan.innerHTML = '📌 选择模式 ◀ 扩展选区 ▶';
        } else {
            selectModeBtn.classList.remove('active');
            selectModeBtn.innerHTML = '🔽 选择';
            modeStatusSpan.innerHTML = '⌨️ 光标模式';
        }
    }

    function toggleSelectMode() {
        selectMode = !selectMode;
        updateModeUI();

        if (selectMode) {
            const selections = editor.listSelections();
            if (selections.length && selections[0].empty()) {
                const cursor = editor.getCursor();
                const line = editor.getLine(cursor.line);
                if (line.length > 0 && cursor.ch < line.length) {
                    editor.setSelection(
                        { line: cursor.line, ch: cursor.ch },
                        { line: cursor.line, ch: Math.min(cursor.ch + 1, line.length) }
                    );
                } else if (cursor.ch > 0) {
                    editor.setSelection(
                        { line: cursor.line, ch: cursor.ch - 1 },
                        { line: cursor.line, ch: cursor.ch }
                    );
                }
            }
            showToast('📌 选择模式已开启，按左右键扩展选区');
        } else {
            const selections = editor.listSelections();
            if (selections.length && !selections[0].empty()) {
                const anchor = selections[0].anchor;
                editor.setCursor(anchor);
            }
            showToast('⌨️ 已退出选择模式');
        }
        editor.focus();
    }

    // 核心：选择模式下的左右移动扩展选区
    function moveAndExtendSelection(direction) {
        if (!selectMode) {
            if (direction === 'left') moveCursorLeft();
            else moveCursorRight();
            return;
        }

        const selections = editor.listSelections();
        if (!selections.length) return;

        const currentSel = selections[0];
        const anchor = currentSel.anchor;
        const head = currentSel.head;

        let from, to;
        if (anchor.line < head.line || (anchor.line === head.line && anchor.ch < head.ch)) {
            from = anchor;
            to = head;
        } else {
            from = head;
            to = anchor;
        }

        let newFrom = { ...from };
        let newTo = { ...to };

        if (direction === 'left') {
            if (from.ch > 0) {
                newFrom = { line: from.line, ch: from.ch - 1 };
            } else if (from.line > 0) {
                const prevLineLength = editor.getLine(from.line - 1).length;
                newFrom = { line: from.line - 1, ch: prevLineLength };
            }
            editor.setSelection(newFrom, newTo);
        } else {
            const lineLength = editor.getLine(to.line).length;
            if (to.ch < lineLength) {
                newTo = { line: to.line, ch: to.ch + 1 };
            } else if (to.line < editor.lineCount() - 1) {
                newTo = { line: to.line + 1, ch: 0 };
            }
            editor.setSelection(newFrom, newTo);
        }
        editor.focus();
    }

    function moveCursorLeft() {
        const cursor = editor.getCursor();
        if (cursor.ch > 0) {
            editor.setCursor({ line: cursor.line, ch: cursor.ch - 1 });
        } else if (cursor.line > 0) {
            const prevLineLength = editor.getLine(cursor.line - 1).length;
            editor.setCursor({ line: cursor.line - 1, ch: prevLineLength });
        }
        editor.focus();
    }

    function moveCursorRight() {
        const cursor = editor.getCursor();
        const lineLength = editor.getLine(cursor.line).length;
        if (cursor.ch < lineLength) {
            editor.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
        } else if (cursor.line < editor.lineCount() - 1) {
            editor.setCursor({ line: cursor.line + 1, ch: 0 });
        }
        editor.focus();
    }

    function moveToLineStart() {
        const cursor = editor.getCursor();
        if (selectMode) {
            const selections = editor.listSelections();
            if (selections.length) {
                const sel = selections[0];
                const anchor = sel.anchor;
                const head = sel.head;
                if (anchor.line < head.line || (anchor.line === head.line && anchor.ch < head.ch)) {
                    editor.setSelection({ line: anchor.line, ch: 0 }, head);
                } else {
                    editor.setSelection(anchor, { line: head.line, ch: 0 });
                }
            }
        } else {
            editor.setCursor({ line: cursor.line, ch: 0 });
        }
        editor.focus();
    }

    function moveToLineEnd() {
        const cursor = editor.getCursor();
        const lineLength = editor.getLine(cursor.line).length;
        if (selectMode) {
            const selections = editor.listSelections();
            if (selections.length) {
                const sel = selections[0];
                const anchor = sel.anchor;
                const head = sel.head;
                if (anchor.line < head.line || (anchor.line === head.line && anchor.ch < head.ch)) {
                    editor.setSelection(anchor, { line: head.line, ch: lineLength });
                } else {
                    editor.setSelection({ line: anchor.line, ch: lineLength }, head);
                }
            }
        } else {
            editor.setCursor({ line: cursor.line, ch: lineLength });
        }
        editor.focus();
    }

    function selectAll() {
        editor.execCommand('selectAll');
        showToast('✅ 已全选');
    }

    async function copySelection() {
        const selected = editor.getSelection();
        if (selected && navigator.clipboard) {
            await navigator.clipboard.writeText(selected);
            showToast('📋 已复制');
        } else if (selected) {
            showToast('选中内容: ' + selected.slice(0, 20));
        } else {
            showToast('未选中文字');
        }
    }

    async function cutSelection() {
        const selected = editor.getSelection();
        if (selected && navigator.clipboard) {
            await navigator.clipboard.writeText(selected);
            editor.replaceSelection('');
            showToast('✂️ 已剪切');
        } else {
            showToast('未选中内容');
        }
    }

    function deleteSelection() {
        const selections = editor.listSelections();
        if (selections.length && !selections[0].empty()) {
            editor.replaceSelection('');
        } else {
            const cursor = editor.getCursor();
            if (cursor.ch > 0) {
                editor.replaceRange('', { line: cursor.line, ch: cursor.ch - 1 }, cursor);
            } else if (cursor.line > 0) {
                const prevLineLength = editor.getLine(cursor.line - 1).length;
                editor.replaceRange('', { line: cursor.line - 1, ch: prevLineLength }, { line: cursor.line, ch: 0 });
            }
        }
        editor.focus();
    }

    function undo() {
        editor.undo();
    }

    function insertText(text) {
        const selections = editor.listSelections();
        if (selections.length && !selections[0].empty()) {
            editor.replaceSelection(text);
        } else {
            const cursor = editor.getCursor();
            editor.replaceRange(text, cursor);
            editor.setCursor({ line: cursor.line, ch: cursor.ch + text.length });
        }
        editor.focus();
    }

    function insertNewline() {
        const cursor = editor.getCursor();
        editor.replaceRange('\n', cursor);
        editor.setCursor({ line: cursor.line + 1, ch: 0 });
        editor.focus();
    }

    function showToast(msg) {
        let toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '100px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = '#1e293bdd';
        toast.style.backdropFilter = 'blur(8px)';
        toast.style.color = 'white';
        toast.style.padding = '6px 18px';
        toast.style.borderRadius = '40px';
        toast.style.fontSize = '0.75rem';
        toast.style.zIndex = '9999';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1200);
    }

    // ========== 绑定事件 ==========
    document.getElementById('selectModeBtn').addEventListener('click', toggleSelectMode);
    document.getElementById('moveLeftBtn').addEventListener('click', () => moveAndExtendSelection('left'));
    document.getElementById('moveRightBtn').addEventListener('click', () => moveAndExtendSelection('right'));
    document.getElementById('moveStartBtn').addEventListener('click', moveToLineStart);
    document.getElementById('moveEndBtn').addEventListener('click', moveToLineEnd);
    document.getElementById('selectAllBtn').addEventListener('click', selectAll);
    document.getElementById('copyBtn').addEventListener('click', copySelection);
    document.getElementById('cutBtn').addEventListener('click', cutSelection);
    document.getElementById('deleteBtn').addEventListener('click', deleteSelection);
    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('deleteCharBtn').addEventListener('click', deleteSelection);
    document.getElementById('newlineBtn').addEventListener('click', insertNewline);
    document.getElementById('addLineBtn').addEventListener('click', () => {
        const current = editor.getValue();
        editor.setValue(current + (current ? '\n新增行' : '新增行'));
        moveToLineEnd();
    });
    document.getElementById('clearEditorBtn').addEventListener('click', () => {
        editor.setValue('');
        showToast('已清空');
    });

    document.querySelectorAll('[data-char]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const ch = btn.dataset.char;
            if (ch !== undefined) insertText(ch);
        });
    });

    updateModeUI();
    editor.focus();
</script>
</body>
</html>
